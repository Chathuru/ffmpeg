name: Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependancies with Homebrew
        run: |
          brew update
          brew install automake fdk-aac git lame libass libtool libvorbis libvpx \
          opus sdl shtool texi2html theora wget x264 x265 xvid nasm pkg-config
      
      - name: Set environment variables
        run: |
          HOMEBREW_PREFIX="$(brew --prefix)"
          
          # Add pkg-config paths for keg-only and standard formulas
          PKG_PATH=""
          for pkg in libffi openssl@3 readline sqlite icu4c zlib; do
            if [ -d "$HOMEBREW_PREFIX/opt/$pkg/lib/pkgconfig" ]; then
              PKG_PATH="$HOMEBREW_PREFIX/opt/$pkg/lib/pkgconfig:$PKG_PATH"
            fi
          done
          PKG_PATH="$HOMEBREW_PREFIX/lib/pkgconfig:$HOMEBREW_PREFIX/share/pkgconfig:$PKG_PATH"
          
          echo "PKG_CONFIG_PATH=$PKG_PATH" >> "$GITHUB_ENV"
          echo "EXTRA_CFLAGS=-I$HOMEBREW_PREFIX/include" >> "$GITHUB_ENV"
          echo "EXTRA_LDFLAGS=-L$HOMEBREW_PREFIX/lib" >> "$GITHUB_ENV"
      
      - name: Verify dependencies
        run: |
          echo "$PKG_CONFIG_PATH"
          
          pkg-config --modversion libmp3lame
          pkg-config --modversion x264
          pkg-config --modversion vpx
          pkg-config --modversion vorbis
          pkg-config --modversion opus
          pkg-config --modversion libass
          pkg-config --modversion fdk-aac   
      
      - name: Configure FFmpeg for Static Embedding
        run: |
          echo "$PKG_CONFIG_PATH"

          ./configure  --prefix=/usr/local --enable-gpl --enable-nonfree --enable-libass \
          --enable-libfdk-aac --enable-libfreetype --enable-libmp3lame \
          --enable-libtheora --enable-libvorbis --enable-libvpx --enable-libx264 --enable-libx265 --enable-libopus --enable-libxvid \
          --pkg-config-flags=--static
      
      - name: Compile the Binary
        run: make -j$(sysctl -n hw.ncpu)
      
      - name: Verify
        run: otool -L ffmpeg
      
      - name: Install
        run: make install DESTDIR="$GITHUB_WORKSPACE/ffmpeg-package"
      
      - name: Artifact Upload
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg
          path: $GITHUB_WORKSPACE/ffmpeg-package
